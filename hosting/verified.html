<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>You're confirmed · Little Blue Market</title>
<link rel="icon" href="/email/cart.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lbm.css">
</head>
<body>
<img class="mark" src="/email/cart.png" alt="Little Blue Market">

<!-- Where Firebase's own "Continue" button lands when its stock handler page
     is still in use (the fallback mail). The branded link never comes here:
     /auth/action shows the same screen itself. -->

<main class="card">
  <div class="badge" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
  </div>
  <h1>You're confirmed</h1>
  <p>Thank you. Your shop orders, and your shop if you sell, can now be linked to your Little Blue Market profile.</p>
  <p class="small">Go back to the app. It notices on its own within a few seconds, or tap <strong>I've confirmed it</strong>.</p>
</main>

<footer>Little Blue Market &middot; <a href="https://littlebluecart.com">littlebluecart.com</a></footer>
</body>
</html>
