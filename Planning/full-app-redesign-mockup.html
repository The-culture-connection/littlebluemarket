<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Blue Market — full app redesign (final)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#9CBFE3;--paperDeep:#84AEDC;--surface:#fff;--ink:#152E52;--ink2:#31507B;--ink3:#5F7BA3;
  --sky:#70A0D0;--skyDeep:#2A5992;--skyMist:#DCE9F7;--skyWash:#F0F5FC;
  --accent:#D56ED1;--accentDeep:#A93BA5;--accentInk:#fff;--accentMist:#F7E2F6;--accentText:#7E2A7A;
  --sage:#4E8A69;--sageMist:#DDEDE4;--clay:#C4796B;--clayMist:#F6E4E0;
  --scrim:rgba(34,40,49,.72);--shadow:0 3px 14px -5px rgba(13,35,66,.38);--lift:0 14px 34px -12px rgba(13,35,66,.5);
  --display:'Fraunces',Georgia,serif;--body:'Nunito',system-ui,sans-serif;
}
.dark{
  --paper:#101E38;--paperDeep:#0B1629;--surface:#1A2C4E;--ink:#E8F0FB;--ink2:#A6BEDB;--ink3:#7A93B5;
  --skyDeep:#9CC3EC;--skyMist:#24406B;--skyWash:#16294A;
  --accentDeep:#D56ED1;--accentInk:#2A0A28;--accentMist:#3B1F3A;--accentText:#EFA8EC;
  --sage:#8CC3A2;--sageMist:#24422F;--clayMist:#4A2C28;--scrim:rgba(5,8,14,.82);
  --shadow:0 3px 14px -5px rgba(0,0,0,.5);--lift:0 14px 34px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:#EEF3F9;color:#152E52;font-family:var(--body);font-size:14px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid #DCE4EE;background:#fff;position:sticky;top:0;z-index:5}
.top h1{font-family:var(--display);font-size:20px;margin:0 14px 0 0;font-weight:700}
.seg{display:inline-flex;background:#E7EEF7;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font:800 12.5px var(--body);color:#31507B;cursor:pointer}
.seg button.on{background:#152E52;color:#fff}
.top .hint{color:#5B7290;font-size:12.5px;margin-left:auto}
.wrap{display:flex;gap:26px;padding:16px 18px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phonewrap{flex:none;position:sticky;top:70px;width:calc(410px * var(--s,1));height:calc(864px * var(--s,1))}
.phonewrap .phone{transform:scale(var(--s,1));transform-origin:top left}
body.nonotes .panel{display:none}
body.nonotes .wrap{justify-content:center}
.phone{width:390px;height:844px;border-radius:44px;background:#0d1626;padding:10px;box-shadow:0 30px 60px -20px rgba(13,35,66,.5);flex:none;position:relative}
.screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:linear-gradient(180deg,var(--paperDeep) 0,var(--paper) 220px);color:var(--ink);position:relative}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#0d1626;border-radius:0 0 18px 18px;z-index:9}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 10px 110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hdr{padding:50px 12px 8px;display:flex;align-items:center;gap:8px}
.hdr h2{font-family:var(--display);font-size:24px;margin:0;font-weight:700;flex:1;letter-spacing:-.01em;line-height:1.05}
.hdr .sub{font-size:12px;color:var(--ink2);font-weight:800}
.search{flex:1;height:42px;border-radius:999px;background:rgba(255,255,255,.92);display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--ink3);font-weight:700;box-shadow:var(--shadow);cursor:pointer}
.dark .search{background:var(--surface)}
.circ{width:42px;height:42px;border-radius:999px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);position:relative;flex:none;cursor:pointer;color:var(--ink)}
.dark .circ{background:var(--surface)}
.circ.pink{background:var(--accentDeep);color:var(--accentInk)}
.circ .n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--accentDeep);color:var(--accentInk);font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.tabsrow{display:flex;gap:2px;padding:0 12px 6px;align-items:center}
.tabsrow div{padding:7px 11px;border-radius:999px;font-weight:900;font-size:14px;color:var(--ink2);cursor:pointer;position:relative}
.tabsrow div.on{color:var(--ink)}
.tabsrow div.on:after{content:'';position:absolute;left:11px;right:11px;bottom:1px;height:3px;border-radius:9px;background:var(--ink)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 12px 10px}
.filters::-webkit-scrollbar{display:none}
.filters div{flex:none;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.55);font-weight:900;font-size:12px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.dark .filters div{background:var(--skyMist)}
.filters div.on{background:var(--ink);color:#fff}
.dark .filters div.on{background:#fff;color:var(--ink)}
/* masonry */
.masonry{columns:2;column-gap:10px}
.pin{break-inside:avoid;margin-bottom:12px;cursor:pointer;position:relative;transition:transform .15s}
.pin:active{transform:scale(.97)}
.pin.wide{column-span:all}
.ph{position:relative;border-radius:18px;overflow:hidden;background:var(--skyMist)}
.ph img{display:block;width:100%;height:auto;transition:transform .5s}
.pin:hover .ph img{transform:scale(1.03)}
.ph .fb{display:none;aspect-ratio:4/5;align-items:flex-start;padding:12px 44px 12px 12px;font:800 13px var(--body);color:#173257;background:linear-gradient(135deg,#F9DDE9,#DCE9F7)}
.ph.nf img{display:none}.ph.nf .fb{display:flex}
.cartbtn{position:absolute;right:8px;bottom:8px;height:34px;padding:0 12px 0 9px;border-radius:999px;background:var(--accentDeep);color:var(--accentInk);display:flex;align-items:center;gap:5px;font:900 12px var(--body);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.cartbtn svg{width:16px;height:16px}
.cartbtn.on{background:var(--ink);color:#fff;animation:bounce .45s cubic-bezier(.2,1.6,.4,1)}
.dark .cartbtn.on{background:#fff;color:var(--ink)}
.pin .cap{padding:7px 4px 0}
.pin .t{font-weight:800;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pin .m{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:11.5px;color:var(--ink2);font-weight:700}
.pin .m .price{font-family:var(--display);font-size:14px;color:var(--ink);font-weight:700;margin-left:auto}
.av{border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex:none;font-size:10px;width:22px;height:22px}
.av.md{width:36px;height:36px;font-size:13px}.av.lg{width:64px;height:64px;font-size:20px}
.added{position:absolute;left:8px;top:8px;background:rgba(21,46,82,.72);backdrop-filter:blur(6px);color:#fff;font:800 11px var(--body);padding:4px 8px;border-radius:99px;display:flex;align-items:center;gap:4px}
.added svg{width:12px;height:12px}
.kind{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.9);color:var(--ink);font:900 10.5px var(--body);padding:3px 8px;border-radius:99px;letter-spacing:.04em}
/* special pins */
.hero{border-radius:20px;overflow:hidden;position:relative;min-height:200px;background:linear-gradient(160deg,#A93BA5,#5E2A8F 70%,#2A5992);color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--lift)}
.hero .k{font-size:10.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero h3{font-family:var(--display);font-size:30px;line-height:1.02;margin:6px 0 8px;font-weight:800;letter-spacing:-.01em}
.hero p{margin:0;font-size:13.5px;opacity:.92;max-width:250px;line-height:1.4}
.hero .cta{margin-top:12px;align-self:flex-start;background:#fff;color:#7E2A7A;padding:9px 16px;border-radius:99px;font-weight:900;font-size:13px}
.hero .glyph{position:absolute;right:-30px;top:-20px;font-size:170px;opacity:.14;transform:rotate(-14deg)}
.hero img{position:absolute;right:0;top:0;height:100%;width:52%;object-fit:cover;opacity:.9;mask-image:linear-gradient(90deg,transparent,#000 40%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%)}
.hero.photo{background:#2A5992}
.hero.photo .grad{position:absolute;inset:0;background:linear-gradient(90deg,#1c3f70 30%,transparent 80%),linear-gradient(0deg,rgba(21,46,82,.7),transparent 60%)}
.hero>*{position:relative}
.note{border-radius:18px;padding:14px;background:var(--surface);box-shadow:var(--shadow);min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.note .ic{font-size:26px}
.note b{font-family:var(--display);font-size:16px;line-height:1.15;display:block;margin:8px 0 4px;font-weight:700}
.note span{font-size:12px;color:var(--ink2);font-weight:700;line-height:1.35}
.note .go{margin-top:10px;align-self:flex-start;background:var(--accentMist);color:var(--accentText);padding:6px 11px;border-radius:99px;font-weight:900;font-size:12px}
.note.pink{background:var(--accentDeep);color:var(--accentInk)}.note.pink span{color:var(--accentInk);opacity:.85}.note.pink .go{background:#fff;color:#7E2A7A}
.note.sage{background:var(--sageMist)}.note.sage .go{background:var(--sage);color:#fff}
.collage{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:18px;overflow:hidden;background:var(--skyMist)}
.collage img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.collage .more{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;font:900 16px var(--display)}
.review .ph{aspect-ratio:1}.review .ph img{height:100%;object-fit:cover}
.starsbar{position:absolute;left:8px;bottom:8px;background:#fff;color:var(--accent);padding:4px 8px;border-radius:99px;font-size:12px;letter-spacing:1px;font-weight:900}
.dark .starsbar{background:var(--surface)}
.quote{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.quote .q{font-family:var(--display);font-size:16px;line-height:1.25;font-weight:600}
.quote .by{margin-top:10px;display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--ink2)}
.shout{border-radius:18px;padding:16px 14px;background:linear-gradient(150deg,var(--sky),#4A7FC0);color:#fff;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end}
.shout .k,.thr .k,.chatpin .k{font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.shout .q{font-family:var(--display);font-size:17px;line-height:1.2;margin:6px 0 10px;font-weight:700}
.shout .by{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
/* community pins */
.thr{border-radius:18px;padding:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.thr .k{color:var(--sage);opacity:1}
.thr .q{font-family:var(--display);font-size:17px;line-height:1.18;font-weight:700}
.thr .reply{font-size:12px;color:var(--ink2);font-weight:700;line-height:1.35;border-left:3px solid var(--sageMist);padding-left:8px}
.thr .foot{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--ink2);margin-top:2px}
.thr .foot .avs{display:flex}.thr .foot .avs .av{margin-right:-6px;border:2px solid var(--surface);width:20px;height:20px;font-size:9px}
.thr .join{margin-left:auto;background:var(--sageMist);color:var(--sage);padding:5px 10px;border-radius:99px;font-weight:900;font-size:11.5px}
.chatpin{border-radius:18px;padding:14px;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.dark .chatpin{background:#0B1629}
.chatpin .k{display:flex;align-items:center;gap:6px}
.chatpin .live{width:7px;height:7px;border-radius:99px;background:#8CC3A2;box-shadow:0 0 0 3px rgba(140,195,162,.3);animation:pulse 1.6s infinite}
.chatpin .b{background:rgba(255,255,255,.12);border-radius:14px 14px 14px 4px;padding:8px 10px;font-size:12.5px;line-height:1.35;font-weight:600}
.chatpin .b b{display:block;font-size:10.5px;opacity:.7;margin-bottom:2px}
.chatpin .foot{font-size:11.5px;font-weight:800;opacity:.8;display:flex;align-items:center;gap:6px}
.chatpin .foot .go{margin-left:auto;background:#fff;color:var(--ink);padding:5px 10px;border-radius:99px;opacity:1;font-size:11.5px}
.poll{border-radius:18px;padding:14px;background:var(--accentMist);display:flex;flex-direction:column;gap:6px}
.poll .k{font-size:10.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--accentText)}
.poll .q{font-family:var(--display);font-size:17px;line-height:1.18;font-weight:700;margin-bottom:4px}
.poll .opt{position:relative;background:rgba(255,255,255,.7);border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:800;overflow:hidden}
.dark .poll .opt{background:rgba(255,255,255,.08)}
.poll .opt i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);opacity:.35;border-radius:10px}
.poll .opt span{position:relative}.poll .opt em{position:absolute;right:10px;top:7px;font-style:normal;font-size:11.5px}
.poll .foot{font-size:11px;font-weight:800;color:var(--accentText);margin-top:2px}
.makers{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px}
.maker{flex:none;width:96px;text-align:center;cursor:pointer}
.maker .ring{width:64px;height:64px;border-radius:99px;padding:3px;background:linear-gradient(135deg,var(--accent),var(--sky));margin:0 auto 6px}
.maker .ring .av{width:100%;height:100%;border:3px solid var(--paper);font-size:16px}
.maker b{display:block;font-size:11.5px;line-height:1.2}
.maker span{font-size:10.5px;color:var(--ink2);font-weight:800}
.sect{font-family:var(--display);font-size:18px;font-weight:700;margin:6px 2px 10px;display:flex;align-items:center}
.sect .see{margin-left:auto;font:900 12px var(--body);color:var(--skyDeep);cursor:pointer}
/* tab bar */
.tabs{position:absolute;left:12px;right:12px;bottom:12px;height:66px;background:var(--surface);border-radius:999px;box-shadow:var(--lift);display:flex;align-items:center;padding:6px;z-index:4}
.tab{flex:1;height:54px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:900;color:var(--ink3);cursor:pointer;position:relative}
.tab.on{color:var(--ink)}
.tab svg{width:22px;height:22px}
.tab .dot{position:absolute;top:10px;right:24px;width:7px;height:7px;border-radius:99px;background:var(--accent)}
.tabs .fabc{width:54px;height:54px;border-radius:99px;background:var(--accentDeep);color:var(--accentInk);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:300;flex:none;margin:0 4px;cursor:pointer;box-shadow:0 6px 16px -6px rgba(169,59,165,.7)}
/* detail */
.floatbar{position:absolute;top:50px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:3}
.floatbar .r{display:flex;gap:8px}
.gallery{position:relative;background:var(--skyMist)}
.gallery .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery .track::-webkit-scrollbar{display:none}
.gallery .track img{width:100%;flex:none;scroll-snap-align:start;aspect-ratio:4/5;object-fit:cover;display:block}
.gallery .dots{position:absolute;bottom:38px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.gallery .dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.55)}.gallery .dots i.on{background:#fff;width:16px}
.gallery .fbig{aspect-ratio:4/5;background:linear-gradient(135deg,#F9DDE9,#DCE9F7);display:none}
.gallery.nf .track{display:none}.gallery.nf .fbig{display:block}
.sheetcard{background:var(--surface);border-radius:26px 26px 0 0;margin-top:-26px;position:relative;padding:18px 16px 16px;box-shadow:var(--lift)}
.sheetcard h3{font-family:var(--display);font-size:24px;line-height:1.08;margin:0 0 6px;font-weight:700}
.rowm{display:flex;align-items:center;gap:8px}
.bigbtn{border:0;flex:1;height:50px;border-radius:999px;font:900 15px var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.bigbtn.cart{background:var(--accentDeep);color:var(--accentInk);box-shadow:0 8px 20px -8px rgba(169,59,165,.8)}
.bigbtn.cart.on{background:var(--ink);color:#fff;animation:bounce .45s cubic-bezier(.2,1.6,.4,1)}
.dark .bigbtn.cart.on{background:#fff;color:var(--ink)}
.bigbtn.ghost{background:var(--skyMist);color:var(--skyDeep);flex:.7}
.proof{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--ink2);margin:12px 0 4px}
.proof .avs{display:flex}.proof .avs .av{margin-right:-7px;border:2px solid var(--surface)}
.price{font-family:var(--display);font-weight:700}
.variants{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.variants div{padding:7px 12px;border-radius:999px;background:var(--skyWash);font-weight:800;font-size:12.5px;cursor:pointer;color:var(--ink2)}
.variants div.on{background:var(--ink);color:#fff}
.dark .variants div.on{background:#fff;color:var(--ink)}
.facts{display:flex;gap:6px;margin:12px 0 0}
.facts div{flex:1;background:var(--skyWash);border-radius:12px;padding:8px 10px;font-size:11px;font-weight:800;color:var(--ink2)}
.facts div b{display:block;font-size:12.5px;color:var(--ink);font-weight:900}
.block{background:var(--surface);border-radius:20px;padding:14px 16px;margin:12px 0}
.block h4{font-family:var(--display);font-size:17px;margin:0 0 8px;font-weight:700;display:flex;align-items:center}
.block h4 .see{margin-left:auto;font:900 12px var(--body);color:var(--skyDeep)}
.hist{display:flex;gap:10px;align-items:center}
.hist .big{font-family:var(--display);font-size:38px;font-weight:700;line-height:1}
.hist .bars{flex:1}
.hist .bar{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;color:var(--ink2);margin:2px 0}
.hist .bar i{flex:1;height:6px;background:var(--skyMist);border-radius:9px;overflow:hidden;display:block}
.hist .bar i b{display:block;height:100%;background:var(--accent);border-radius:9px}
.rv{display:flex;gap:8px;padding:8px 0;border-top:1px solid var(--skyWash);font-size:13px;line-height:1.4}
.rv:first-of-type{border:0}
.rv .s{color:var(--accent);font-size:11px;letter-spacing:1px}
.rv b{font-weight:900}
.rv .ph2{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.comments{margin-top:14px;border-top:1px solid var(--skyWash);padding-top:10px}
.cm{display:flex;gap:8px;padding:6px 0;font-size:13px}
.cm b{font-weight:900}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--skyWash);color:var(--ink2);font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.chip.acc{background:var(--accentMist);color:var(--accentText)}
.chip.sg{background:var(--sageMist);color:var(--sage)}
.composer{position:absolute;left:0;right:0;bottom:84px;padding:6px 12px 10px;background:linear-gradient(0deg,var(--paper) 70%,transparent);display:flex;gap:8px;align-items:center;z-index:3}
.composer .in{flex:1;height:46px;background:var(--surface);border-radius:999px;padding:0 16px;display:flex;align-items:center;color:var(--ink3);font-weight:700;box-shadow:var(--shadow)}
/* chat */
.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.msg .bub{background:var(--surface);border-radius:18px 18px 18px 5px;padding:10px 13px;max-width:265px;box-shadow:var(--shadow);font-size:14px;line-height:1.4;font-weight:600}
.msg.me{flex-direction:row-reverse}.msg.me .bub{background:var(--accentDeep);color:var(--accentInk);border-radius:18px 18px 5px 18px}
.msg .n{font-size:11.5px;font-weight:900;color:var(--ink2);margin-bottom:3px}
.msg .prod{display:flex;gap:8px;align-items:center;background:var(--skyWash);border-radius:12px;padding:8px;margin-bottom:8px;color:var(--ink)}
.msg .prod img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.pinned{background:var(--surface);border-radius:16px;padding:10px 12px;margin:0 0 12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);cursor:pointer}
.pinned b{font-size:13px}.pinned span{font-size:12px;color:var(--ink2);font-weight:700}
/* seller */
.sellhead{text-align:center;padding:6px 0 14px}
.sellhead .av{margin:0 auto 8px}
.sellhead h3{font-family:var(--display);font-size:24px;margin:0;font-weight:700}
.sellhead .m{font-size:12.5px;color:var(--ink2);font-weight:800;margin-top:3px}
.sellhead .btns{display:flex;gap:8px;justify-content:center;margin-top:12px}
.btn{border:0;background:var(--accentDeep);color:var(--accentInk);font:900 13px var(--body);padding:9px 16px;border-radius:999px;cursor:pointer}
.btn.ghost{background:rgba(255,255,255,.7);color:var(--ink)}
.dark .btn.ghost{background:var(--skyMist);color:var(--ink)}
.stats3{display:flex;gap:6px;margin:0 0 14px}
.stats3 div{flex:1;text-align:center;background:rgba(255,255,255,.55);border-radius:14px;padding:8px}
.dark .stats3 div{background:var(--skyMist)}
.stats3 b{font-family:var(--display);font-size:18px;display:block}
.stats3 span{font-size:10.5px;font-weight:800;color:var(--ink2)}
/* overlays */
.toast{position:absolute;left:16px;right:16px;top:58px;background:var(--surface);border-radius:18px;padding:10px 14px;box-shadow:var(--lift);display:flex;gap:10px;align-items:center;z-index:30;animation:down .4s cubic-bezier(.2,1.3,.4,1)}
.toast img{width:40px;height:40px;border-radius:12px;object-fit:cover}
.toast .ic{width:40px;height:40px;border-radius:12px;background:var(--accentMist);display:flex;align-items:center;justify-content:center;font-size:20px}
.toast b{display:block;font-size:13.5px}.toast span{font-size:12px;color:var(--ink2);font-weight:700}
.toast .go{margin-left:auto;font:900 12px var(--body);color:var(--accentDeep)}
.overlay{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface);border-radius:30px 30px 0 0;padding:12px 18px 26px;animation:up .32s cubic-bezier(.2,1.1,.4,1)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--skyMist);margin:0 auto 14px}
.sheet h3{font-family:var(--display);margin:0 0 6px;font-size:22px}
.sheet .opt{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--skyWash);cursor:pointer;font-weight:800}
.sheet .opt:last-of-type{border:0}
.sheet .opt .ic{width:44px;height:44px;border-radius:14px;background:var(--skyWash);display:flex;align-items:center;justify-content:center;font-size:22px}
.sheet .opt span{font-size:12px;color:var(--ink2);display:block;font-weight:700}
.pop{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px}
.pop .card{background:var(--surface);border-radius:28px;overflow:hidden;width:100%;box-shadow:var(--lift);animation:pop .4s cubic-bezier(.2,1.3,.4,1)}
.pop .pi{height:190px;position:relative;background:#2A5992}
.pop .pi img{width:100%;height:100%;object-fit:cover;opacity:.9}
.pop .pb{padding:16px 18px 18px}
.pop h3{font-family:var(--display);font-size:26px;line-height:1.05;margin:0 0 8px}
.pop p{margin:0 0 14px;color:var(--ink2);font-size:14px;line-height:1.5;font-weight:600}
@keyframes down{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(140,195,162,.3)}50%{box-shadow:0 0 0 7px rgba(140,195,162,.05)}}
/* panel */
.panel{width:430px;max-width:100%;background:#fff;border-radius:22px;box-shadow:0 10px 28px -14px rgba(13,35,66,.35);overflow:hidden;color:#152E52}
.ptabs{display:flex;border-bottom:1px solid #E5ECF4}
.ptabs div{flex:1;text-align:center;padding:12px 6px;font-weight:900;font-size:13px;color:#5B7290;cursor:pointer;border-bottom:3px solid transparent}
.ptabs div.on{color:#152E52;border-color:#D56ED1}
.pbody{padding:18px 20px;max-height:770px;overflow-y:auto;font-size:13.5px;line-height:1.55}
.pbody h4{font-family:var(--display);font-size:17px;margin:16px 0 6px}
.pbody h4:first-child{margin-top:0}
.pbody p{margin:0 0 10px}
.pbody ul{padding-left:18px;margin:0 0 10px}.pbody li{margin-bottom:5px}
.pbody .small{font-size:12px;color:#5B7290}
.jump{border:1px solid #E5ECF4;border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.jump:hover{border-color:#D56ED1}
.jump .n{width:24px;height:24px;border-radius:99px;background:#152E52;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.jump b{display:block;font-size:13.5px}.jump span{color:#5B7290;font-size:12.5px}
.loop{background:#F4F7FB;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.loop b{font-family:var(--display);font-size:15px}
.mix{display:flex;gap:4px;margin:6px 0 12px}
.mix div{height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;color:#fff}
</style>
</head>

const S={theme:'light',user:'new',screen:'feed',arg:null,stack:[],carted:{},toast:null,sheet:null,popup:true,tab:'for you',filter:'all',variant:0,gal:0,joined:{},followed:{},notified:{},ptab:'screens'};

function go(s,arg){S.stack.push({screen:S.screen,arg:S.arg});S.screen=s;S.arg=arg;S.sheet=null;S.variant=0;S.gal=0;render();}
function back(){const p=S.stack.pop();if(p){S.screen=p.screen;S.arg=p.arg;}else S.screen='feed';S.sheet=null;render();}
function tabTo(s){S.stack=[];S.screen=s;S.arg=null;S.sheet=null;render();}
function toast(t,s,k){S.toast={t,s,k};render();clearTimeout(S._tt);S._tt=setTimeout(()=>{S.toast=null;render();},2400);}
function cart(k,ev){ev&&ev.stopPropagation();S.carted[k]=!S.carted[k];if(S.carted[k])toast('In your little blue cart',P[k].t,k);else render();}

/* ---- pins ---- */
function pin(k,opts={}){const p=P[k],on=!!S.carted[k];return `<div class="pin" data-kind="product" onclick="go('product','${k}')">
  <div class="ph"><img src="${img(p.f)}" alt="" onerror="nf(this)" loading="lazy"><div class="fb" style="aspect-ratio:${['4/5','1','3/4','5/6'][p.t.length%4]}">${p.t}</div>

function quotePin(){return `<div class="pin" data-kind="review" onclick="go('review','jam')"><div class="quote"><div class="q">"The peach one did not survive the car ride home."</div><div class="by">${av('AM')} Ama · on the jam sampler ★★★★★</div></div></div>`;}

  if(S.sheet==='compose') h+=`<div class="overlay" onclick="S.sheet=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div><h3>Post something</h3>${[['🛒','Post my cart','A snapshot of what\'s in it'],['⭐','Review something I bought','Jam sampler is waiting'],['💬','Ask the community','Starts a forum thread'],['📣','Shoutout a maker','They get a push'],['🏷️','List a product','Sellers · goes to review first']].map(([i,t,s])=>`<div class="opt" onclick="S.sheet=null;render();toast('Posted 🎉','It\\'s live in the feed','')"><div class="ic">${i}</div><div>${t}<span>${s}</span></div></div>`).join('')}</div></div>`;
  if(S.sheet==='review') h+=`<div class="overlay" onclick="S.sheet=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div><div class="rowm"><img src="${img(P.jam.f,200)}" style="width:52px;height:52px;border-radius:14px;object-fit:cover" onerror="this.style.display='none'"><div><h3 style="margin:0;font-size:20px">How was the jam?</h3><span style="font-size:12px;color:var(--ink2);font-weight:800">Berries & Flour · delivered Tue</span></div></div><div style="font-size:40px;letter-spacing:8px;text-align:center;margin:16px 0 4px;color:var(--accent)">★★★★★</div><div style="text-align:center;font-size:11.5px;font-weight:800;color:var(--ink3);margin-bottom:10px">Tap a star · that alone counts</div><div class="quick">${['Peach is gone already','Great gift','Would buy again','Jar was leaking'].map(q=>`<span class="chip">${q}</span>`).join('')}</div><div class="quick" style="padding-top:0"><span class="chip acc">📷 Add a photo</span></div><button class="bigbtn cart" style="width:100%;margin-top:8px" onclick="S.sheet=null;render();toast('Review posted','Berries & Flour will see it','jam')">Post review</button></div></div>`;
  if(S.toast) h+=`<div class="toast">${S.toast.k?`<img src="${img(P[S.toast.k].f,200)}" onerror="this.style.display='none'">`:`<div class="ic">✨</div>`}<div><b>${S.toast.t}</b><span>${S.toast.s}</span></div>${S.toast.k?`<span class="go" onclick="go('cartscreen')">View</span>`:''}</div>`;
  return h;}
function render(){$('screen').innerHTML=(SC[S.screen]||SC.feed)()+overlays();document.body.classList.toggle('dark',S.theme==='dark');

document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;render();});

const UX=[
  ['Land on a moment','Welcome popup (once) → feed opens on the announcement hero. One idea: adding to cart is the like.',()=>{S.user='new';S.popup=true;tabTo('feed');}],
  ['Scroll the grid','Products, reviews, carts, forum threads, chat and a poll all in one masonry. Filter chips narrow by kind; Community is one chip.',()=>{S.popup=false;S.filter='all';tabTo('feed');}],
  ['Cart from the grid','Tap the pill on a photo → bounce + toast with the photo → cart badge ticks. No screen change.',()=>{S.popup=false;tabTo('feed');cart('jam');}],
  ['Open a product','Gallery with dots → seller row with Ask → price, variants, proof ("340 carted · Rae and 2 you\'ve bought from") → one huge Add to cart → facts (ship/pickup/returns) → reviews with histogram and seller replies → comments → more from maker → also in carts with this.',()=>{S.popup=false;go('product','jam');}],
  ['Ask the maker','"Ask" on the product opens a DM already about that product; the maker can drop a product card that adds to cart.',()=>{go('dm','BF');}],
  ['Buy → deliver → review','After delivery a pink "How was the jam?" note appears in the feed. One-tap stars, chips, optional photo. The review becomes a pin.',()=>{S.user='regular';S.popup=false;tabTo('feed');S.sheet='review';render();}],
  ['Review → someone else\'s cart','Review pins show the product with a star strip; "4 carted from this review" closes the loop for the reviewer.',()=>{go('review','cream');}],
  ['Community in the feed','Forum pins show the question + best reply + Join in. Chat pins show the live room. Tapping lands you inside with quick replies preloaded.',()=>{S.popup=false;S.filter='community';tabTo('feed');}],
  ['Post your cart','Cart screen → "Post this cart" → snapshot pin with a collage and Add all. Other people\'s carts are bundles.',()=>{go('cartpost');}],
  ['Admin levers','Announcements are hero pins; polls are pins; a pinned message tops Open chat. All three from the admin site you already have.',()=>{S.user='regular';S.popup=false;S.filter='announce';tabTo('feed');}],
];
window.UX=UX;
function renderPanel(){const b=$('pbody');document.querySelectorAll('.ptabs div').forEach(d=>d.classList.toggle('on',d.dataset.p===S.ptab));
  if(S.ptab==='ux'){b.innerHTML=`<p class="small">The optimal path through the app, step by step. Tap a step to put the phone there.</p>`+UX.map((u,i)=>`<div class="jump" onclick="UX[${i}][2]();render()"><div class="n">${i+1}</div><div><b>${u[0]}</b><span>${u[1]}</span></div></div>`).join('')+
    `<h4>The three loops</h4>
    <div class="loop"><b>Buy loop</b><br>see → cart → buy → deliver → review → (review becomes a pin) → someone else sees.</div>
    <div class="loop"><b>Talk loop</b><br>see a thread or the room in the feed → tap in → reply with a chip → thread/room shows in your feed as it moves → you come back.</div>
    <div class="loop"><b>Maker loop</b><br>listing approved → "post it?" push → pin in feed → carted count → drop alerts → restock pin → repeat.</div>
    <p class="small">Every loop ends back in the grid. That's what makes it sticky: the feed is where the consequences of your actions show up.</p>`;}
  else if(S.ptab==='mix'){b.innerHTML=`<h4>What's in the feed now</h4>
    <div class="mix"><div style="flex:9;background:#2A5992">Products</div><div style="flex:3;background:#D56ED1">Reviews</div><div style="flex:2;background:#152E52">Community</div><div style="flex:2;background:#4E8A69">Forums</div><div style="flex:1;background:#A93BA5">Cart</div><div style="flex:1;background:#C4796B">Admin</div></div>
    <p>Roughly: half products, a fifth reviews and carts, a fifth community, and one admin thing per screen. The filter chips let someone go pure-products or pure-community without leaving the grid.</p>
    <h4>Community pin types</h4>
    <ul><li><b>Forum thread</b> — question, best reply, avatars of who's in it, reply count, Join in. Shows in the feed when it's new, when it heats up, or when someone you've bought from replies.</li>
    <li><b>Open chat moment</b> — dark pin, live dot, last two messages, "14 in the last hour". Refreshes on every visit so it's never the same twice.</li>
    <li><b>Poll</b> — you post it as admin; results show after voting. Cheap, high engagement, and it tells you something.</li>
    <li><b>Shoutout</b> — text on blue gradient, taps through to the maker.</li>
    <li><b>Product cards inside chat/threads</b> — makers drop a product into a conversation; it carts from there. Community feeds commerce and vice versa.</li></ul>
    <h4>Rules that keep it from being noise</h4>
    <ul><li>Never two of the same kind in a row (products excepted).</li><li>One chat moment per screen-height, max.</li><li>Forum pins only for forums you joined, or threads with 5+ replies, or near you.</li><li>One admin pin per screen: announcement OR poll, hero only for the newest.</li><li>A dismissed nudge stays gone 7 days.</li></ul>
    <h4>Backend needed</h4>
    <p class="small">A feed-assembly function that merges: posts (exists), reviews (exists), cart posts (exists), thread activity (needs a "hot threads" query on <code>threads</code> by <code>commentCount</code> + recency), chat moments (a 1-hour rolling count + last 2 messages from <code>chatroom</code>), announcements and polls (announcement model + a new <code>polls</code> collection). Client just renders by <code>kind</code>.</p>`;}
  else{b.innerHTML=`<p class="small">Every screen in the app, in the new style. Tap to open.</p>`+AREAS.map((a,ai)=>`<h4>${a[0]}</h4>`+a[1].map((sc,i)=>`<div class="jump" onclick="AREAS[${ai}][1][${i}][1]();render()"><div class="n">${i+1}</div><div><b>${sc[0]}</b></div></div>`).join('')).join('');}
}

  </div>${tabs('you')}</div>`;};

SC.directory=()=>`<div class="view">${hdr('Little Blue Cart directory','','Businesses, services, and makers off-app too')}<div class="filters"><div class="on">All</div><div>📍 Near me</div><div>Food</div><div>Services</div><div>Retail</div></div>

/* extra overlays */
const _ov=overlays;overlays=function(){let h=_ov();
  if(S.sheet==='underreview') h+=`<div class="pop" onclick="S.sheet=null;render()"><div class="card" onclick="event.stopPropagation()"><div class="pb" style="text-align:center;padding-top:28px"><div style="font-size:48px">🕊️</div><h3>Sent for review</h3><p>LBM looks at every listing before it goes live — usually a day or two. You'll get a push, and it'll appear in your shop and on littlebluemarket.com.</p><button class="bigbtn cart" style="width:100%" onclick="S.sheet=null;render();toast('Opening Shipturtle','Track it on your vendor dashboard','')">Track it in Shipturtle ↗</button><div style="text-align:center;font-size:12.5px;font-weight:800;color:var(--ink2);margin-top:10px;cursor:pointer" onclick="S.sheet=null;go('sell')">Back to your shop</div></div></div></div>`;
  if(S.user==='guest'&&S.screen==='feed'&&!S.sheet) h+=`<div style="position:absolute;left:12px;right:12px;bottom:90px;z-index:5;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--lift)"><div style="flex:1;font-size:13px;font-weight:800">Browsing as a guest · join to cart, chat and buy</div><span class="chip" style="background:#fff;color:var(--ink)" onclick="go('setup')">Join</span></div>`;
  return h;};

/* screens index */
const AREAS=[
  ['Onboarding',[['Welcome',()=>go('welcome')],['Sign in',()=>go('signin')],['Verify code',()=>go('verify')],['Profile setup',()=>go('setup')],['Guest feed',()=>{S.user='guest';S.popup=false;tabTo('feed')}]]],
  ['Market',[['Feed',()=>{S.user='new';S.popup=false;S.filter='all';tabTo('feed')}],['Search',()=>go('search')],['Tag = collection page',()=>go('tag','#WomanOwned')],['Store collection',()=>go('collection')],['Keyword results',()=>go('results','jam')],['Product detail',()=>go('product','jam')],['Reviews list',()=>go('reviews')],['Review detail',()=>go('review','cream')],['Cart post',()=>go('cartpost')],['Maker board',()=>go('seller','MW')],['Cart',()=>{cart('jam');go('cartscreen')}],['Checkout',()=>go('checkout')]]],
  ['Community',[['Open chat',()=>go('chat')],['Forums',()=>go('forums')],['Forum (threads)',()=>go('forum')],['Thread',()=>go('thread','vote')],['New forum',()=>go('newforum')],['Messages',()=>go('messages')],['DM with a maker',()=>go('dm','BF')]]],
  ['You',[['You hub (new)',()=>{S.user='new';go('you')}],['You hub (regular)',()=>{S.user='regular';go('you')}],['Edit profile',()=>go('editprofile')],['Notifications',()=>go('notifs')],['Notification settings',()=>go('settings')],]],
  ['Seller',[['Your shop',()=>go('sell')],['Add product',()=>go('addproduct')],['Under review modal',()=>{go('addproduct');S.sheet='underreview';render()}],['Directory',()=>go('directory')]]],
  ['Admin',[['Announce / poll',()=>go('admin')]]],
];
window.AREAS=AREAS;

render();
let fitMode='fit';
function fit(){const top=document.querySelector('.top').offsetHeight;const avail=window.innerHeight-top-32;const sc=fitMode==='fit'?Math.min(1,avail/864):1;document.documentElement.style.setProperty('--s',sc.toFixed(3));}
window.addEventListener('resize',fit);fit();
document.querySelectorAll('#fitSeg button').forEach(b=>b.onclick=()=>{fitMode=b.dataset.f;document.querySelectorAll('#fitSeg button').forEach(x=>x.classList.toggle('on',x===b));fit();});
document.getElementById('notesBtn').onclick=function(){document.body.classList.toggle('nonotes');this.textContent=document.body.classList.contains('nonotes')?'Show notes':'Hide notes';fit();};
</script>
