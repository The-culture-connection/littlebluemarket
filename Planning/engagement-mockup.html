<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Blue Market — engagement mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#9CBFE3; --surface:#fff; --ink:#152E52; --ink2:#31507B; --ink3:#6B87AD;
  --sky:#70A0D0; --skyDeep:#2A5992; --skyMist:#DCE9F7; --skyWash:#F0F5FC;
  --accent:#D56ED1; --accentDeep:#A93BA5; --accentInk:#fff; --accentMist:#F7E2F6; --accentText:#7E2A7A;
  --sage:#4E8A69; --sageMist:#DDEDE4; --clay:#C4796B; --clayMist:#F6E4E0;
  --scrim:rgba(34,40,49,.7);
  --shadow:0 3px 14px -5px rgba(13,35,66,.34); --lift:0 10px 28px -10px rgba(13,35,66,.44);
  --display:'Fraunces',Georgia,'Times New Roman',serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --pageBg:#EEF3F9; --pageInk:#152E52; --pageMuted:#5B7290; --panel:#fff;
}
.dark{
  --paper:#101E38; --surface:#1A2C4E; --ink:#E8F0FB; --ink2:#A6BEDB; --ink3:#7A93B5;
  --sky:#70A0D0; --skyDeep:#9CC3EC; --skyMist:#24406B; --skyWash:#16294A;
  --accent:#D56ED1; --accentDeep:#D56ED1; --accentInk:#2A0A28; --accentMist:#3B1F3A; --accentText:#EFA8EC;
  --sage:#8CC3A2; --sageMist:#24422F; --clay:#DE9A8C; --clayMist:#4A2C28;
  --scrim:rgba(5,8,14,.8);
  --shadow:0 3px 14px -5px rgba(0,0,0,.5); --lift:0 10px 28px -10px rgba(0,0,0,.62);
}
*{box-sizing:border-box}
body{margin:0;background:var(--pageBg);color:var(--pageInk);font-family:var(--body);font-size:14px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid #DCE4EE;background:#fff;position:sticky;top:0;z-index:5}
.top h1{font-family:var(--display);font-size:20px;margin:0 14px 0 0;font-weight:700}
.seg{display:inline-flex;background:#E7EEF7;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;font:700 12.5px var(--body);color:#31507B;cursor:pointer}
.seg button.on{background:#152E52;color:#fff}
.top .hint{color:var(--pageMuted);font-size:12.5px;margin-left:auto}
.wrap{display:flex;gap:26px;padding:22px 18px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
/* phone */
.phone{width:390px;height:844px;border-radius:44px;background:#0d1626;padding:10px;box-shadow:0 30px 60px -20px rgba(13,35,66,.5);flex:none;position:relative}
.screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--paper);color:var(--ink);position:relative;font-family:var(--body)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#0d1626;border-radius:0 0 18px 18px;z-index:9}
.status{height:44px}
.view{position:absolute;inset:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 14px 110px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hdr{padding:48px 14px 10px;display:flex;align-items:center;gap:10px}
.hdr h2{font-family:var(--display);font-size:22px;margin:0;font-weight:700;flex:1}
.hdr .sub{font-size:12.5px;color:var(--ink2);font-weight:600}
.pillsearch{flex:1;background:var(--surface);border-radius:999px;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;color:var(--ink3);font-weight:600;box-shadow:var(--shadow);cursor:pointer}
.circ{width:44px;height:44px;border-radius:999px;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);position:relative;flex:none;cursor:pointer;color:var(--ink)}
.circ.pink{background:var(--accentDeep);color:var(--accentInk)}
.circ .dot{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:99px;background:var(--accent);border:2px solid var(--surface)}
.circ .n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:99px;background:var(--accentDeep);color:var(--accentInk);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.nearme{height:44px;padding:0 14px;border-radius:999px;background:var(--surface);display:flex;align-items:center;gap:6px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;font-size:13.5px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--accentMist);color:var(--accentText);font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.sky{background:var(--skyMist);color:var(--skyDeep)}
.chip.solid{background:var(--accentDeep);color:var(--accentInk)}
.chip.ghost{background:var(--surface);color:var(--ink2);box-shadow:var(--shadow)}
.card{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px;position:relative}
.card.tap{cursor:pointer}
.card h3{font-family:var(--display);font-size:17px;margin:0 0 4px;font-weight:700;line-height:1.2}
.card p{margin:0;font-size:14px;line-height:1.5;color:var(--ink)}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.tiny{font-size:12px}.xs{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;color:#fff;flex:none;font-family:var(--body)}
.av.sm{width:28px;height:28px;font-size:10px}.av.lg{width:64px;height:64px;font-size:20px}
.name{font-weight:800;font-size:14.5px}
.who .meta{font-size:12px;color:var(--ink2);font-weight:600}
.dots{margin-left:auto;color:var(--ink2);font-weight:900;letter-spacing:1px;cursor:pointer}
.img{border-radius:18px;height:230px;margin:12px 0 10px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.img.short{height:150px}
.art{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.actions{display:flex;align-items:center;gap:18px;padding:2px 0 6px}
.actions .a{display:flex;align-items:center;gap:5px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink)}
.actions .a.on{color:var(--accentDeep)}
.actions .buy{margin-left:auto}
.btn{border:0;background:var(--accentDeep);color:var(--accentInk);font:800 13.5px var(--body);padding:9px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--skyMist);color:var(--skyDeep)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--skyMist)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.w{width:100%;padding:12px}
.price{font-family:var(--display);font-size:20px;font-weight:700}
.stars{color:var(--accent);letter-spacing:1px;font-size:13px}
.count{font-weight:800;font-size:13px}
.count b{font-weight:800}
.tag{display:inline-block;background:var(--accentMist);color:var(--accentText);font-weight:700;font-size:12px;padding:4px 9px;border-radius:99px;margin:8px 6px 0 0}
/* engagement pieces */
.hero{background:linear-gradient(135deg,var(--accentDeep),#7E2A7A);color:#fff;border-radius:22px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--lift);position:relative;overflow:hidden;cursor:pointer}
.dark .hero{background:linear-gradient(135deg,#8C2E88,#4B1449)}
.hero .kicker{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h3{font-family:var(--display);font-size:22px;margin:4px 0 6px;color:#fff;line-height:1.15}
.hero p{color:rgba(255,255,255,.9);font-size:13.5px}
.hero .cta{display:inline-block;margin-top:12px;background:#fff;color:#7E2A7A;padding:8px 14px;border-radius:99px;font-weight:800;font-size:13px}
.hero .cartglyph{position:absolute;right:-8px;bottom:-14px;font-size:96px;opacity:.16;transform:rotate(-12deg)}
.pulse{background:var(--surface);border-radius:22px;padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.pulse .t{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pulse .live{width:8px;height:8px;border-radius:99px;background:var(--sage);box-shadow:0 0 0 3px var(--sageMist)}
.stats{display:flex;gap:8px}
.stat{flex:1;background:var(--skyWash);border-radius:14px;padding:9px 10px;cursor:pointer}
.stat b{font-family:var(--display);font-size:18px;display:block;line-height:1.1}
.stat span{font-size:11.5px;color:var(--ink2);font-weight:700}
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.story{flex:none;width:66px;text-align:center;cursor:pointer}
.story .ring{width:60px;height:60px;border-radius:99px;padding:3px;background:linear-gradient(135deg,var(--accent),var(--sky));margin:0 auto 5px}
.story .ring.seen{background:var(--skyMist)}
.story .ring .av{width:100%;height:100%;border:3px solid var(--surface)}
.story .lbl{font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nudge{background:var(--accentMist);border-radius:22px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;cursor:pointer}
.nudge .ic{width:44px;height:44px;border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.nudge .tx{flex:1}
.nudge .tx b{display:block;font-size:14px}
.nudge .tx span{font-size:12.5px;color:var(--accentText);font-weight:700}
.nudge.sky{background:var(--skyMist)}.nudge.sky .tx span{color:var(--skyDeep)}
.nudge.sage{background:var(--sageMist)}.nudge.sage .tx span{color:var(--sage)}
.journey{background:var(--surface);border-radius:22px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.journey .bar{height:8px;border-radius:99px;background:var(--skyMist);margin:8px 0 10px;overflow:hidden}
.journey .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--accent),var(--accentDeep));border-radius:99px}
.step{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;font-weight:700;font-size:13.5px}
.step .ck{width:22px;height:22px;border-radius:99px;border:2px solid var(--skyMist);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.step.done .ck{background:var(--sage);border-color:var(--sage);color:#fff}
.step.done{color:var(--ink3);text-decoration:line-through}
.step .go{margin-left:auto;color:var(--accentDeep);font-size:12px}
.cartgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.cartgrid .ti{height:92px;border-radius:14px;display:flex;align-items:flex-end;padding:8px;font-weight:800;font-size:12px;color:var(--ink)}
.makers{display:flex;gap:10px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.maker{flex:none;width:118px;background:var(--skyWash);border-radius:16px;padding:10px;cursor:pointer}
.maker .av{margin-bottom:6px}
.maker b{display:block;font-size:12.5px}
.maker span{font-size:11px;color:var(--ink2);font-weight:700}
.streak{display:inline-flex;align-items:center;gap:5px;background:var(--accentMist);color:var(--accentText);padding:4px 10px;border-radius:99px;font-weight:800;font-size:12px}
.drop{background:var(--surface);border-radius:22px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;cursor:pointer}
.drop .clock{font-family:var(--display);font-size:22px;font-weight:700;color:var(--accentDeep);white-space:nowrap}
.caught{text-align:center;padding:18px 10px;color:var(--ink2);font-weight:700}
.caught .btn{margin-top:10px}
/* tab bar */
.tabs{position:absolute;left:14px;right:14px;bottom:14px;height:64px;background:var(--surface);border-radius:999px;box-shadow:var(--lift);display:flex;align-items:center;padding:6px;z-index:4}
.tab{flex:1;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:800;color:var(--skyDeep);cursor:pointer;position:relative}
.tab.on{background:var(--accentMist);color:var(--accentDeep)}
.tab svg{width:20px;height:20px}
.tab .bdg{position:absolute;top:8px;right:22px;min-width:16px;height:16px;border-radius:99px;background:var(--accentDeep);color:var(--accentInk);font-size:10px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tab .dot{position:absolute;top:10px;right:26px;width:7px;height:7px;border-radius:99px;background:var(--accent)}
/* chat */
.msg{display:flex;gap:8px;margin-bottom:12px;align-items:flex-start}
.msg .bub{background:var(--surface);border-radius:18px;padding:10px 14px;max-width:270px;box-shadow:var(--shadow);font-size:14px;line-height:1.45}
.msg.me{flex-direction:row-reverse}.msg.me .bub{background:var(--accentDeep);color:var(--accentInk)}
.msg .n{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:3px}
.msg .bub .prod{display:flex;gap:8px;align-items:center;background:var(--skyWash);border-radius:12px;padding:8px;margin-bottom:8px;color:var(--ink)}
.msg .bub .prod .ti{width:40px;height:40px;border-radius:10px;flex:none}
.composer{position:absolute;left:0;right:0;bottom:90px;padding:8px 12px 10px;background:var(--paper);display:flex;gap:9px;align-items:center;z-index:3}
.composer .in{flex:1;height:46px;background:var(--surface);border-radius:999px;padding:0 16px;display:flex;align-items:center;color:var(--ink3);font-weight:600;box-shadow:var(--shadow)}
.quick{display:flex;gap:7px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.pinned{background:var(--surface);border-radius:16px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);cursor:pointer}
.pinned .pin{color:var(--accentDeep);font-size:16px}
.pinned b{font-size:13px}
.pinned span{font-size:12px;color:var(--ink2);font-weight:600}
.thread{background:var(--surface);border-radius:18px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer}
.thread .t{font-weight:800;font-size:14.5px;margin-bottom:3px}
.thread .m{font-size:12px;color:var(--ink2);font-weight:600}
.hot{display:inline-block;background:var(--clayMist);color:var(--clay);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
.new{display:inline-block;background:var(--sageMist);color:var(--sage);font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
.inbox{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px}
.irow{display:flex;gap:12px;padding:12px 14px;align-items:center;border-bottom:1px solid var(--skyWash);cursor:pointer}
.irow:last-child{border-bottom:0}
.irow .tx{flex:1;min-width:0}
.irow .tx b{display:block;font-size:14px}
.irow .tx span{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.irow .tm{font-size:11.5px;color:var(--ink3);font-weight:700;text-align:right}
.irow .un{margin:4px 0 0 auto;min-width:20px;height:20px;border-radius:99px;background:var(--accentDeep);color:var(--accentInk);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
/* profile */
.prof{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.ring{width:78px;height:78px;border-radius:99px;background:conic-gradient(var(--accent) 0 68%,var(--skyMist) 68% 100%);display:flex;align-items:center;justify-content:center;flex:none}
.ring .av{width:66px;height:66px;font-size:20px;border:3px solid var(--paper)}
.pstats{display:flex;gap:6px;margin-bottom:12px}
.pstat{flex:1;background:var(--surface);border-radius:16px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.pstat b{font-family:var(--display);font-size:19px;display:block}
.pstat span{font-size:11px;color:var(--ink2);font-weight:700}
.segs{display:flex;background:var(--surface);border-radius:999px;padding:4px;margin-bottom:12px;box-shadow:var(--shadow)}
.segs div{flex:1;text-align:center;padding:8px;border-radius:999px;font-weight:800;font-size:12.5px;color:var(--skyDeep);cursor:pointer}
.segs div.on{background:var(--accentMist);color:var(--accentDeep)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid3 .ti{aspect-ratio:1;border-radius:14px;position:relative;cursor:pointer}
.grid3 .ti .lb{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.85);color:#152E52;font-size:10px;font-weight:800;padding:2px 6px;border-radius:99px}
.week{display:flex;gap:6px;margin:4px 0 2px}
.week div{flex:1;text-align:center;font-size:10.5px;font-weight:800;color:var(--ink3)}
.week div i{display:block;height:28px;border-radius:8px;background:var(--skyMist);margin-bottom:4px}
.week div.on i{background:var(--accent)}
.notif{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--skyWash)}
.notif:last-child{border-bottom:0}
.notif .tx{flex:1;font-size:13.5px}
.notif .tx b{font-weight:800}
.notif .tm{font-size:11px;color:var(--ink3);font-weight:700}
.notif .ic{width:34px;height:34px;border-radius:12px;background:var(--skyWash);display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
/* popup + toast */
.overlay{position:absolute;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:center;justify-content:center;padding:26px}
.pop{background:var(--surface);border-radius:26px;overflow:hidden;width:100%;box-shadow:var(--lift)}
.pop .pimg{height:170px;background:linear-gradient(135deg,var(--sky),var(--accent));display:flex;align-items:center;justify-content:center;font-size:64px}
.pop .pb{padding:16px 18px 18px}
.pop h3{font-family:var(--display);font-size:22px;margin:0 0 6px}
.pop p{margin:0 0 14px;color:var(--ink2);font-size:14px;line-height:1.5}
.pop .x{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:99px;background:rgba(255,255,255,.85);color:#152E52;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer}
.toast{position:absolute;left:18px;right:18px;top:58px;background:var(--surface);border-radius:18px;padding:10px 14px;box-shadow:var(--lift);display:flex;gap:10px;align-items:center;z-index:30;animation:down .35s cubic-bezier(.2,.9,.3,1.2)}
.toast .ic{width:36px;height:36px;border-radius:12px;background:var(--accentMist);display:flex;align-items:center;justify-content:center;font-size:18px}
.toast b{display:block;font-size:13.5px}.toast span{font-size:12px;color:var(--ink2);font-weight:600}
@keyframes down{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:30px 30px 0 0;padding:14px 18px 26px;z-index:25;box-shadow:var(--lift);animation:up .3s ease-out}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--skyMist);margin:0 auto 12px}
.sheet h3{font-family:var(--display);margin:0 0 8px;font-size:19px}
.sheet .opt{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--skyWash);cursor:pointer;font-weight:700}
.sheet .opt:last-of-type{border:0}
.sheet .opt .ic{width:40px;height:40px;border-radius:14px;background:var(--skyWash);display:flex;align-items:center;justify-content:center;font-size:20px}
.sheet .opt span{font-size:12px;color:var(--ink2);display:block;font-weight:600}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.back{width:40px;height:40px;border-radius:99px;background:var(--surface);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;flex:none;font-weight:900}
.fab{position:absolute;right:20px;bottom:92px;width:54px;height:54px;border-radius:99px;background:var(--accentDeep);color:var(--accentInk);display:flex;align-items:center;justify-content:center;box-shadow:var(--lift);cursor:pointer;z-index:4;font-size:26px;font-weight:300}
.pulltab{text-align:center;color:var(--skyDeep);font-weight:800;font-size:13px;padding:0 0 8px;cursor:pointer}
.chipnote{font-size:11px;color:var(--ink3);font-weight:700;margin:2px 0 8px}
.ann{border:2px solid var(--accentMist);border-radius:22px;padding:12px 14px;margin-bottom:12px;background:var(--surface);cursor:pointer}
.ann .k{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accentText)}
.ann b{display:block;font-family:var(--display);font-size:16px;margin:3px 0}
.ann p{font-size:13px;color:var(--ink2)}
.lbl{font-family:var(--display);font-weight:700;font-size:15px;margin:4px 0 8px;display:flex;align-items:center}
.lbl .see{margin-left:auto;font:800 12px var(--body);color:var(--skyDeep);cursor:pointer}
.dim{opacity:.55}
/* panel */
.panel{width:440px;max-width:100%;background:var(--panel);border-radius:22px;box-shadow:0 10px 28px -14px rgba(13,35,66,.35);overflow:hidden;color:#152E52}
.ptabs{display:flex;border-bottom:1px solid #E5ECF4}
.ptabs div{flex:1;text-align:center;padding:12px 6px;font-weight:800;font-size:13px;color:#5B7290;cursor:pointer;border-bottom:3px solid transparent}
.ptabs div.on{color:#152E52;border-color:#D56ED1}
.pbody{padding:16px 18px;max-height:770px;overflow-y:auto;font-size:13.5px;line-height:1.55}
.pbody h4{font-family:var(--display);font-size:16px;margin:16px 0 6px}
.pbody h4:first-child{margin-top:0}
.pbody p{margin:0 0 10px}
.idea{border:1px solid #E5ECF4;border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.idea:hover{border-color:#D56ED1}
.idea b{display:block;font-size:13.5px}
.idea span{color:#5B7290;font-size:12.5px}
.idea .k{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:#F7E2F6;color:#7E2A7A;margin-left:6px;vertical-align:middle;letter-spacing:.06em}
.idea .k.be{background:#DCE9F7;color:#2A5992}
.idea .k.both{background:#DDEDE4;color:#4E8A69}
.pbody ul{padding-left:18px;margin:0 0 10px}
.pbody li{margin-bottom:5px}
.verdict{background:#F7E2F6;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.verdict b{font-family:var(--display);font-size:15px}
.map{display:grid;grid-template-columns:1fr;gap:6px}
.mstep{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:12px;background:#F4F7FB;cursor:pointer}
.mstep .n{width:22px;height:22px;border-radius:99px;background:#152E52;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px}
.mstep b{display:block;font-size:13px}
.mstep span{font-size:12px;color:#5B7290}
@media (max-width:900px){.wrap{gap:18px}.panel{width:390px}.pbody{max-height:none}}
</style>
</head>
<body>
<div class="top">
  <h1>Little Blue Market · engagement mockup</h1>
  <div class="seg" id="modeSeg"><button class="on" data-m="warm">Warm nudges</button><button data-m="full">Full social</button></div>
  <div class="seg" id="themeSeg"><button class="on" data-t="light">Light</button><button data-t="dark">Dark</button></div>
  <div class="seg" id="userSeg"><button class="on" data-u="new">New user</button><button data-u="regular">Regular</button></div>
  <span class="hint">Everything in the phone is tappable. Flip the toggles to compare.</span>
</div>
<div class="wrap">
  <div class="phone"><div class="notch"></div><div class="screen" id="screen"></div></div>
  <div class="panel">
    <div class="ptabs"><div class="on" data-p="ideas">Ideas</div><div data-p="journey">Guided journey</div><div data-p="feed">Feed recipe</div><div data-p="auto">Auto-post?</div></div>
    <div class="pbody" id="pbody"></div>
  </div>
</div>
<script>
/* ---------- data ---------- */
const AV = {
  HG:['#D56ED1','HG'], DW:['#5F6A82','DW'], KB:['#B565B0','KB'], AM:['#4E8A69','AM'], JA:['#7BAE8B','J&'], RO:['#D98A9A','RO'], TW:['#D9A05B','TW'], ME:['#70A0D0','ME'], LB:['#152E52','LB'], DD:['#2A5992','DD'], NS:['#C4796B','NS']
};
const av = (k,cls='')=>`<div class="av ${cls}" style="background:${AV[k][0]}">${AV[k][1]}</div>`;
const tile = (c1,c2,glyph,extra='')=>`<div class="art" style="background:linear-gradient(135deg,${c1},${c2});${extra}"><svg viewBox="0 0 120 120" width="150" height="150" fill="none" stroke="#173257" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${glyph}</svg></div>`;
const G = {
  hat:'<path d="M20 80c0-22 18-40 40-40s40 18 40 40"/><path d="M12 82c20 10 76 10 96 0"/><path d="M60 40v-8"/>',
  mug:'<rect x="30" y="35" width="50" height="55" rx="10"/><path d="M80 50h10a12 12 0 0 1 0 24H80"/><path d="M40 35v-8M55 35v-12M70 35v-8"/>',
  tube:'<rect x="45" y="20" width="30" height="80" rx="8"/><path d="M45 40h30M45 80h30"/><rect x="52" y="12" width="16" height="8" rx="3"/>',
  vase:'<path d="M45 20h30l-6 25c0 8 16 14 16 34s-15 30-25 30-25-10-25-30 16-26 16-34z"/><path d="M55 12v8M65 12v8"/>',
  tee:'<path d="M35 30l20-10 5 8 5-8 20 10 10 20-14 8v50H39V58l-14-8z"/>',
  candle:'<rect x="35" y="45" width="50" height="55" rx="8"/><path d="M60 45V32"/><path d="M60 32c-6-8 0-14 0-14s6 6 0 14z" fill="#173257"/>',
  cart:'<path d="M20 30h14l10 44h42l10-30H40"/><circle cx="48" cy="90" r="6"/><circle cx="80" cy="90" r="6"/>',
  bag:'<path d="M30 45h60l-6 55H36z"/><path d="M45 45v-8a15 15 0 0 1 30 0v8"/>',
  sticker:'<circle cx="60" cy="60" r="34"/><path d="M45 62c5 10 25 10 30 0"/><circle cx="50" cy="52" r="2" fill="#173257"/><circle cx="70" cy="52" r="2" fill="#173257"/>'
};
const P = {
  hat:{c:['#F9DDE9','#F3C3D7'],g:G.hat,name:'"What Would Dolly Do?" Dad Hat',by:'HG',shop:'Holler Goods',loc:'Nashville, TN',price:'$28',rating:'4.8',n:52,added:508,com:61,desc:'Unstructured six-panel in blush, embroidered in raspberry.',tags:['#WomanOwned','#VoteCollection']},
  mug:{c:['#DCE9F7','#BFD6EF'],g:G.mug,name:'FDT Flowers Mug',by:'DD',shop:'Daybreak Digitals',loc:'Detroit, MI',price:'$18',rating:'4.9',n:31,added:212,com:14,desc:'11oz ceramic, dishwasher safe. Flowers by hand, printed in-house.',tags:['#BIPOCOwned','#Gifts']},
  tube:{c:['#E7EFE9','#CFE2D5'],g:G.tube,name:'Cocoa Mint Lip Tube',by:'KB',shop:'Kali Brooks',loc:'Ypsilanti, MI',price:'$9',rating:'5.0',n:88,added:640,com:33,desc:'Old hand-stamped label — first 20 tubes of the restock.',tags:['#SmallBatch']},
  vase:{c:['#F6E4E0','#EACBC4'],g:G.vase,name:'Delphinium Vessel',by:'JA',shop:'Juniper & Ash',loc:'Ann Arbor, MI',price:'$64',rating:'4.7',n:19,added:98,com:9,desc:'Stoneware, hand-thrown. Each one a little different.',tags:['#WomanOwned','#Handmade']},
  tee:{c:['#EAE4F6','#D6CBEE'],g:G.tee,name:'FDT Flowers Tee',by:'DD',shop:'Daybreak Digitals',loc:'Detroit, MI',price:'$32',rating:'4.8',n:44,added:301,com:22,desc:'Heavyweight cotton, screen-printed. Runs true to size.',tags:['#BIPOCOwned']},
  candle:{c:['#FBEBD3','#F4D8B0'],g:G.candle,name:'Porch Light Candle',by:'NS',shop:'North Studio',loc:'Ferndale, MI',price:'$22',rating:'4.6',n:27,added:156,com:11,desc:'Soy wax, cedar + orange. 40hr burn.',tags:['#LGBTQOwned']}
};
const artOf=(k,h='',extra='')=>`<div class="img ${h}">${tile(P[k].c[0],P[k].c[1],P[k].g,extra)}</div>`;
const mini=(k,cls='')=>`<div class="${cls}" style="background:linear-gradient(135deg,${P[k].c[0]},${P[k].c[1]})"></div>`;

/* ---------- state ---------- */
const S = {mode:'warm',theme:'light',user:'new',screen:'feed',stack:[],popup:true,toast:null,sheet:null,carted:{},filter:'all',ptab:'ideas',ptabP:'bought',joined:false};
const $ = id=>document.getElementById(id);
function go(s,arg){S.stack.push({screen:S.screen,arg:S.arg});S.screen=s;S.arg=arg;S.sheet=null;render();}
function back(){const p=S.stack.pop();if(p){S.screen=p.screen;S.arg=p.arg;}else{S.screen='feed';}S.sheet=null;render();}
function tab(s){S.stack=[];S.screen=s;S.arg=null;S.sheet=null;render();}
function toast(t,s,ic='🛒'){S.toast={t,s,ic};render();clearTimeout(S._tt);S._tt=setTimeout(()=>{S.toast=null;render();},2200);}
function cart(k,ev){ev&&ev.stopPropagation();S.carted[k]=!S.carted[k];if(S.carted[k])toast(`Added to your little blue cart`,`${P[k].name} · tap the bag to check out`);else render();}
function sheet(name){S.sheet=name;render();}

/* ---------- pieces ---------- */
const ICON={
  market:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  community:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>',
  you:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  cart:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.5 11h11l2-7H7"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></svg>',
  cartF:'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 4h2l2.5 11h11l2-7H7z"/><circle cx="9" cy="20" r="1.8"/><circle cx="17" cy="20" r="1.8"/></svg>',
  cmt:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>',
  rep:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  search:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  pin:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>',
  bag:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  bell:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',
  send:'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 11l18-8-8 18-2-8z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 7l9 6 9-6"/></svg>'
};
const full=()=>S.mode==='full';
function tabs(active){
  const cb = full()? '<span class="bdg">5</span>' : '<span class="dot"></span>';
  const yb = full()? '<span class="bdg">2</span>' : '';
  return `<div class="tabs">
    <div class="tab ${active==='market'?'on':''}" onclick="tab('feed')">${ICON.market}Market</div>
    <div class="tab ${active==='community'?'on':''}" onclick="tab('chat')">${ICON.community}Community${active!=='community'?cb:''}</div>
    <div class="tab ${active==='you'?'on':''}" onclick="tab('you')">${ICON.you}You${active!=='you'?yb:''}</div></div>`;
}
function postCard(k,opts={}){
  const p=P[k],on=S.carted[k];
  return `<div class="card tap" onclick="go('post','${k}')">
    <div class="row who">${av(p.by)}<div><div class="name">${p.shop}</div><div class="meta">${ICON.pin} ${p.loc} · ships free</div></div><div class="dots" onclick="event.stopPropagation();sheet('more')">•••</div></div>
    ${artOf(k)}
    <div class="actions">
      <div class="a ${on?'on':''}" onclick="cart('${k}',event)">${on?ICON.cartF:ICON.cart} ${on?'In your cart':'Add to cart'}</div>
      <div class="a">${ICON.cmt} ${p.com}</div>
      <div class="a" onclick="event.stopPropagation();toast('Reposted to your profile','Your people will see it in their feed','🔁')">${ICON.rep}</div>
      <button class="btn sm buy" onclick="event.stopPropagation();go('product','${k}')">Buy</button>
    </div>
    <div class="count"><b>${p.added+(on?1:0)} added</b> <span class="muted">· ${p.com} comments</span></div>
    <p style="margin-top:6px">${p.name} — ${p.desc}</p>
    <div>${p.tags.map(t=>`<span class="tag" onclick="event.stopPropagation();go('results','${t}')">${t}</span>`).join('')}</div>
    <div class="row" style="margin-top:10px"><span class="price">${p.price}</span><span class="stars">★★★★★</span><span class="tiny muted"><b>${p.rating}</b> (${p.n})</span>
    ${opts.social?`<span class="xs faint" style="margin-left:auto">${av('RO','sm')}</span>`:''}</div>
    ${opts.social?`<div class="xs muted" style="margin-top:8px">Rae Ortiz and 3 people you've bought from carted this</div>`:''}
  </div>`;
}
function reviewCard(){return `<div class="card tap" onclick="go('post','tube')">
  <div class="row who">${av('DW')}<div><div class="name">Dee Wells</div><div class="meta">Reviewed · 5h · <span style="color:var(--sage)">✓ bought it</span></div></div><div class="dots">•••</div></div>
  <div class="stars" style="margin-top:8px">★★★★★</div>
  <p style="margin-top:4px">Fourth tube. It survives a Michigan February and the paper tube composts with my coffee grounds.</p>
  <div class="row" style="margin-top:10px;background:var(--skyWash);border-radius:14px;padding:8px" onclick="event.stopPropagation();go('product','tube')">${mini('tube','av')}<div style="flex:1"><b style="font-size:13px">Cocoa Mint Lip Tube</b><div class="xs muted">Kali Brooks · $9</div></div><button class="btn sm" onclick="cart('tube',event)">${S.carted.tube?'In cart':'Add'}</button></div>
  <div class="actions" style="margin-top:8px"><div class="a">${ICON.cmt} 4</div><div class="a">${ICON.rep}</div><span class="xs faint" style="margin-left:auto">Helpful? <b>12 said yes</b></span></div>
</div>`;}
function cartPost(){return `<div class="card tap" onclick="go('post','hat')">
  <div class="row who">${av('KB')}<div><div class="name">Kali Brooks</div><div class="meta">posted her cart · 2h</div></div><div class="dots">•••</div></div>
  <p style="margin-top:8px">Gift run for my sister's shop opening 💙</p>
  <div class="cartgrid">${['hat','mug','vase','candle'].map(k=>mini(k,'ti')).map((h,i)=>h.replace('</div>',`${P[['hat','mug','vase','candle'][i]].price}</div>`)).join('')}</div>
  <div class="row"><span class="count">4 items · $132</span><button class="btn sm" style="margin-left:auto" onclick="event.stopPropagation();toast('4 items added','Kali\\'s whole cart is now in yours')">Add all to cart</button></div>
  <div class="actions" style="margin-top:6px"><div class="a">${ICON.cmt} 7</div><div class="a">${ICON.rep} 3</div></div>
</div>`;}
function shoutout(){return `<div class="card tap" onclick="go('post','vase')">
  <div class="row who">${av('AM')}<div><div class="name">Ama Mensah</div><div class="meta">shoutout to <b style="color:var(--skyDeep)">@juniperandash</b> · 6h</div></div><div class="dots">•••</div></div>
  <p style="margin-top:8px">Got the vessel back from a repair I didn't even ask for. Credit on my next order. This is why I shop here.</p>
  <div class="actions" style="margin-top:8px"><div class="a">${ICON.cmt} 9</div><div class="a">${ICON.rep} 5</div><span class="chip sky" style="margin-left:auto" onclick="event.stopPropagation();go('seller','JA')">Visit Juniper &amp; Ash →</span></div>
</div>`;}
function announcementHero(){return `<div class="hero" onclick="go('announcement')"><div class="kicker">From Little Blue Market</div><h3>no likes here. just carts.</h3><p>Adding something to your cart is how you say "I love this". Sellers see what's being carted — it's a real signal, not a vanity number.</p><span class="cta">See how it works</span><div class="cartglyph">🛒</div></div>`;}
function announcementCard(){return `<div class="ann" onclick="go('announcement')"><div class="k">Announcement · Sun</div><b>town hall · monday 9/28, 7pm</b><p>Come tell us what to build next. Live in the app — tap to set a reminder.</p><button class="btn sm" style="margin-top:6px" onclick="event.stopPropagation();toast('Reminder set','We\\'ll ping you 15 min before','🔔')">Remind me</button></div>`;}
function pulse(){return `<div class="pulse"><div class="t"><span class="live"></span>Today in the market</div>
  <div class="stats"><div class="stat" onclick="go('results','new')"><b>3</b><span>new makers</span></div><div class="stat" onclick="go('results','#trending')"><b>128</b><span>things carted</span></div><div class="stat" onclick="tab('chat')"><b>14</b><span>chat msgs / hr</span></div></div></div>`;}
function stories(){return `<div class="card" style="padding:12px 12px 8px"><div class="rail">
  <div class="story" onclick="go('drop')"><div class="ring"><div class="av" style="background:var(--accentDeep);font-size:22px">+</div></div><div class="lbl">Your cart</div></div>
  ${[['KB','Kali · drop'],['DD','Daybreak'],['HG','Holler'],['JA','Juniper'],['NS','North'],['TW','Torres']].map(([k,l],i)=>`<div class="story" onclick="go('seller','${k}')"><div class="ring ${i>3?'seen':''}">${av(k)}</div><div class="lbl">${l}</div></div>`).join('')}
</div><div class="chipnote">Restocks &amp; drops in the last 24h</div></div>`;}
function dropCard(){return `<div class="drop" onclick="go('drop')">${mini('tube','av lg')}<div style="flex:1"><b style="font-size:14px">Kali's restock drops in</b><div class="tiny muted">20 hand-stamped tubes · 340 people waiting</div></div><div class="clock">02:14:09</div></div>`;}
function journey(){
  const steps=[['Set up your profile',true,'you'],['Add your first item to cart',!!Object.keys(S.carted).length,'feed'],['Say hi in Open chat',S.joined,'chat'],['Follow a #tag you care about',false,'search'],['Post a review of something you bought',false,'compose']];
  const done=steps.filter(s=>s[1]).length;
  return `<div class="journey"><div class="row"><div><b style="font-family:var(--display);font-size:16px">Your first week 🌱</b><div class="tiny muted">${done} of ${steps.length} · finish for 50 points</div></div><span class="streak" style="margin-left:auto">✦ ${done*10} pts</span></div>
  <div class="bar"><i style="width:${done/steps.length*100}%"></i></div>
  ${steps.map(s=>`<div class="step ${s[1]?'done':''}" onclick="${s[2]==='compose'?"sheet('compose')":`tab('${s[2]==='feed'?'feed':s[2]==='search'?'search':s[2]}')`}"><div class="ck">${s[1]?'✓':''}</div>${s[0]}${s[1]?'':'<span class="go">Go →</span>'}</div>`).join('')}</div>`;
}
function nudgeReview(){return `<div class="nudge" onclick="sheet('review')"><div class="ic">📦</div><div class="tx"><b>Your Cocoa Mint tubes landed Tuesday</b><span>How were they? A review helps Kali and takes 20 seconds →</span></div></div>`;}
function nudgeChat(){return `<div class="nudge sky" onclick="tab('chat')"><div class="ic">💬</div><div class="tx"><b>Open chat is buzzing</b><span>"Anyone tabling at Eastern Market Sunday?" · 14 replies →</span></div></div>`;}
function nudgeThread(){return `<div class="nudge sage" onclick="go('thread')"><div class="ic">🧵</div><div class="tx"><b>New in #VoteCollection forum</b><span>"Deadline for October is Friday" — 6 sellers replied →</span></div></div>`;}
function makers(){return `<div class="card"><div class="lbl">Makers near you <span class="see" onclick="go('results','near')">See all</span></div><div class="makers">
  ${[['DD','Daybreak Digitals','Detroit · 4 new'],['KB','Kali Brooks','Ypsi · restock'],['JA','Juniper & Ash','Ann Arbor'],['NS','North Studio','Ferndale · new']].map(([k,n,m])=>`<div class="maker" onclick="go('seller','${k}')">${av(k)}<b>${n}</b><span>${m}</span></div>`).join('')}</div></div>`;}
function askCart(){return `<div class="card" style="background:var(--accentMist);box-shadow:none"><div class="row"><div style="flex:1"><b style="font-family:var(--display);font-size:16px">What's in your little blue cart?</b><div class="tiny" style="color:var(--accentText);font-weight:700">Share it as a post — people can add the whole thing in one tap.</div></div><button class="btn" onclick="sheet('compose')">Post my cart</button></div></div>`;}
function caught(){return `<div class="caught">You're all caught up ✨<div class="tiny faint" style="font-weight:600;margin-top:4px">5 new messages in Community</div><button class="btn ghost sm" onclick="tab('chat')">Go see</button></div>`;}

/* ---------- screens ---------- */
const V = {};
V.feed = ()=>{
  const isNew=S.user==='new';
  let body='';

V.you = ()=>{const isNew=S.user==='new';return `<div class="view"><div class="hdr"><h2>You</h2><div class="circ" onclick="go('notifs')">${ICON.bell}<span class="dot"></span></div><div class="circ" onclick="go('messages')">${ICON.mail}${full()?'<span class="n">2</span>':''}</div><div class="circ" onclick="sheet('more')">•••</div></div>
  <div class="scroll" style="padding-top:4px">
    <div class="prof"><div class="ring" onclick="sheet('points')">${av('ME','lg')}</div><div style="flex:1"><b style="font-family:var(--display);font-size:20px">Morgan Ellis</b><div class="tiny muted">@morgan · Ypsilanti, MI</div><div class="row" style="margin-top:6px;gap:6px"><span class="streak" onclick="sheet('points')">✦ ${isNew?'20':'140'} pts · Level ${isNew?'1':'3'}</span>${full()?'<span class="streak" style="background:var(--clayMist);color:var(--clay)">🔥 3</span>':''}</div></div></div>
    <div class="pstats"><div class="pstat"><b>${isNew?'0':'12'}</b><span>bought</span></div><div class="pstat"><b>${isNew?Object.keys(S.carted).length:'7'}</b><span>in cart</span></div><div class="pstat"><b>${isNew?'0':'5'}</b><span>reviews</span></div><div class="pstat"><b>${isNew?'0':'3'}</b><span>posts</span></div></div>
    ${isNew?journey():`<div class="card"><div class="lbl">Your week</div><div class="week">${['M','T','W','T','F','S','S'].map((d,i)=>`<div class="${[0,1,3].includes(i)?'on':''}"><i></i>${d}</div>`).join('')}</div><div class="tiny muted">Bought 1 · carted 4 · 2 reviews · 1 shoutout. Post a review to keep the streak.</div></div>`}
    ${!isNew?`<div class="nudge" onclick="sheet('review')"><div class="ic">📦</div><div class="tx"><b>2 things waiting for a review</b><span>Cocoa Mint tubes · Porch Light candle →</span></div></div>`:''}
    <div class="card" style="padding:12px 14px"><div class="row"><div class="ic" style="width:40px;height:40px;border-radius:14px;background:var(--sageMist);display:flex;align-items:center;justify-content:center;font-size:20px">🏪</div><div style="flex:1"><b>Got something to sell?</b><div class="tiny muted">Apply in 2 minutes. Your shop lives in the app and on littlebluemarket.com.</div></div><span class="chip sky" onclick="toast('Seller application','Opens the form','📝')">Start</span></div></div>
    <div class="segs">${['bought','reviews','posts','saved'].map(t=>`<div class="${S.ptabP===t?'on':''}" onclick="S.ptabP='${t}';render()">${t[0].toUpperCase()+t.slice(1)}</div>`).join('')}</div>
    ${isNew&&S.ptabP==='bought'?`<div class="card" style="text-align:center;padding:26px 16px"><div style="font-size:34px">🛍️</div><b>Nothing bought yet</b><p class="muted tiny" style="margin-top:4px">Your cart has ${Object.keys(S.carted).length} thing${Object.keys(S.carted).length===1?'':'s'} waiting.</p><button class="btn sm" style="margin-top:10px" onclick="go('cartscreen')">Open cart</button></div>`
    :`<div class="grid3">${['tube','candle','mug','vase','tee','hat'].map(k=>`<div class="ti" style="background:linear-gradient(135deg,${P[k].c[0]},${P[k].c[1]})" onclick="go('product','${k}')"><span class="lb">${S.ptabP==='bought'?'★ review':P[k].price}</span></div>`).join('')}</div>`}
  </div>${tabs('you')}</div>`;};
V.notifs = ()=>`<div class="view"><div class="hdr"><div class="back" onclick="back()">‹</div><h2>Notifications</h2><span class="chip ghost xs">Mark read</span></div>
  <div class="scroll" style="padding-top:4px">
    <div class="card"><div class="lbl">New</div>
      ${[['🛒','<b>Rae Ortiz</b> and 2 others carted your review of Cocoa Mint','2h','post'],['💬','<b>Holler Goods</b> replied to your comment: "not so far — it\'s thread"','3h','post'],['📣','<b>Little Blue Market</b>: town hall Monday 7pm','5h','announcement'],['📦','Your <b>Porch Light candle</b> was delivered — review it?','1d','review'],['✦','You reached <b>Level 3</b> · 140 pts','2d','points']].map(([i,t,tm,r])=>`<div class="notif" style="cursor:pointer" onclick="${r==='review'||r==='points'?`sheet('${r}')`:`go('${r}')`}"><div class="ic">${i}</div><div class="tx">${t}<div class="tm">${tm}</div></div></div>`).join('')}</div>
    <div class="card dim"><div class="lbl">Earlier</div><div class="notif"><div class="ic">👋</div><div class="tx"><b>Ama Mensah</b> mentioned you in Open chat<div class="tm">Mon</div></div></div></div>
  </div>${tabs('you')}</div>`;

/* ---------- overlays ---------- */
function popup(){return `<div class="overlay" onclick="S.popup=false;render()"><div class="pop" onclick="event.stopPropagation()" style="position:relative"><div class="x" onclick="S.popup=false;render()">×</div><div class="pimg">🛒</div><div class="pb"><h3>${S.user==='new'?'welcome in 💙':'no likes here. just carts.'}</h3><p>${S.user==='new'?'Little Blue Market is a feed of real makers near you. There\'s no like button — adding something to your cart is how you say you love it. Start with anything that catches your eye.':'Adding to cart is the like. Sellers see it, and your cart keeps things for later. Nothing to buy right now? Add it anyway.'}</p><button class="btn w" onclick="S.popup=false;render()">${S.user==='new'?'Show me the market':'Got it'}</button></div></div></div>`;}
function sheets(){
  if(S.sheet==='compose') return `<div class="overlay" style="align-items:flex-end;padding:0" onclick="S.sheet=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div><h3>Post something</h3>
    ${[['🛒','Post my cart','Share a snapshot of what\'s in it · 4 items'],['⭐','Review something I bought','2 waiting: Cocoa Mint, Porch Light'],['📣','Shoutout a maker','Tag them with @ — they get a push'],['🏷️','List a product','Sellers only · goes to review first']].map(([i,t,s])=>`<div class="opt" onclick="S.sheet=null;render();toast('Posted 🎉','+10 points · it\\'s live in the feed','✦')"><div class="ic">${i}</div><div>${t}<span>${s}</span></div></div>`).join('')}</div></div>`;
  if(S.sheet==='review') return `<div class="overlay" style="align-items:flex-end;padding:0" onclick="S.sheet=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div><div class="row">${mini('tube','av')}<div><h3 style="margin:0">How were the tubes?</h3><span class="tiny muted">Kali Brooks · delivered Tue</span></div></div>
    <div style="font-size:36px;letter-spacing:6px;text-align:center;margin:16px 0 6px;color:var(--accent);cursor:pointer">★★★★★</div><div class="xs faint" style="text-align:center;font-weight:700;margin-bottom:12px">Tap a star · that alone counts</div>
    <div class="quick">${['Smells amazing','Lasted all winter','Great packaging','Would buy again'].map(q=>`<span class="chip ghost">${q}</span>`).join('')}</div>
    <div class="in" style="height:46px;background:var(--skyWash);border-radius:16px;padding:0 14px;display:flex;align-items:center;color:var(--ink3);font-weight:600;margin-bottom:12px">Say a little more (optional)</div>
    <button class="btn w" onclick="S.sheet=null;render();toast('Review posted','Kali will see it · +15 points','⭐')">Post review</button></div></div>`;
  if(S.sheet==='points') return `<div class="overlay" style="align-items:flex-end;padding:0" onclick="S.sheet=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div><h3>Points</h3><p class="muted tiny" style="margin:0 0 12px">Buying, selling and showing up all count. Levels unlock little things — early access to drops, a badge on your posts. Nothing to buy with them (yet).</p>
    ${[['Buy something','+25'],['Post a review','+15'],['Post your cart / a shoutout','+10'],['Add to cart','+2'],['Reply in a forum or chat','+1']].map(([t,p])=>`<div class="opt"><div style="flex:1">${t}</div><b style="color:var(--accentDeep)">${p}</b></div>`).join('')}</div></div>`;
  if(S.sheet==='more') return `<div class="overlay" style="align-items:flex-end;padding:0" onclick="S.sheet=null;render()"><div class="sheet" onclick="event.stopPropagation()"><div class="grab"></div>${[['🔗','Share'],['🔕','Hide posts like this'],['🚩','Report']].map(([i,t])=>`<div class="opt"><div class="ic">${i}</div><div>${t}</div></div>`).join('')}</div></div>`;
  return '';
}
function render(){
  const root=$('screen');
  root.innerHTML=`<div class="status"></div>${(V[S.screen]||V.feed)()}${S.sheet?sheets():''}${S.popup&&S.screen==='feed'?popup():''}${S.toast?`<div class="toast"><div class="ic">${S.toast.ic}</div><div><b>${S.toast.t}</b><span>${S.toast.s}</span></div></div>`:''}`;
  document.body.classList.toggle('dark',S.theme==='dark');
  renderPanel();
}

/* ---------- panel ---------- */
const IDEAS = [
  {t:'Feed opens with a moment, not a product',d:'Announcement hero or "Today in the market" pulse. Gives the feed a heartbeat before the first card.',k:'FE',go:()=>tab('feed')},
  {t:'Mixed card rhythm',d:'Product → nudge → review → cart post → makers rail → product. Never more than two of the same kind in a row.',k:'FE',go:()=>tab('feed')},
  {t:'"N added" social proof',d:'Cart count replaces likes (already decided). Full-social mode adds "Rae and 3 people you bought from carted this".',k:'BOTH',go:()=>tab('feed')},
  {t:'Review nudge after delivery',d:'One-tap star sheet with chips. Stars alone count. Appears in feed, You tab and notifications.',k:'BOTH',go:()=>{tab('feed');S.user='regular';render();sheet('review');}},
  {t:'Community pull-in cards',d:'"Open chat is buzzing" and "New in your forum" cards in the Market feed bridge the two tabs.',k:'FE',go:()=>tab('feed')},
  {t:'Cart posts with "Add all"',d:'A friend\'s cart becomes a bundle. One tap copies it. Ask-card at the bottom of the feed prompts people to post theirs.',k:'BOTH',go:()=>tab('feed')},
  {t:'Makers near you rail',d:'Horizontal rail of nearby shops with a reason to tap ("4 new", "restock").',k:'BE',go:()=>tab('feed')},
  {t:'First-week journey card',d:'5 steps, progress bar, points. Lives in the feed and the You tab until done. Each step deep-links.',k:'BOTH',go:()=>{S.user='new';tab('feed');}},
  {t:'Quick-reply chips everywhere',d:'Chat, threads, DMs and comments get 2–3 tappable starters. Lowers the cost of the first message.',k:'FE',go:()=>tab('chat')},
  {t:'Product context in DMs',d:'Thread header shows what you\'re talking about; sellers can drop a product card that adds to cart.',k:'BOTH',go:()=>go('dm')},
  {t:'Pinned admin message in Open chat',d:'Your announcement doubles as the room\'s pinned card — free real estate you already control.',k:'BE',go:()=>tab('chat')},
  {t:'Forum activity markers',d:'"🔥 active", "near you", "6 new replies today" tell people where to go instead of a flat list.',k:'BE',go:()=>go('forums')},
  {t:'"Ask the maker" on every post',d:'A DM entry point right under the post — turns browsing into conversation.',k:'FE',go:()=>go('post','hat')},
  {t:'Points ring + weekly rhythm',d:'Profile avatar wears a progress ring; "Your week" shows the days you showed up. Points already exist as a concept.',k:'BOTH',go:()=>tab('you')},
  {t:'Stories-style drop rail (full mode)',d:'Restocks and drops from the last 24h as rings. Countdown "drop" card with Notify me.',k:'BOTH',go:()=>{S.mode='full';tab('feed');}},
  {t:'Streaks + "all caught up" (full mode)',d:'A streak pill in the header, an end-of-feed card that hands you to Community. Addictive, but noisier.',k:'FE',go:()=>{S.mode='full';tab('feed');}},
  {t:'Cute toasts for your own actions',d:'Add to cart, repost, review → a soft card drops from the top. Never for other people\'s actions.',k:'FE',go:()=>{tab('feed');cart('hat');}},
];
function renderPanel(){
  const b=$('pbody');
  document.querySelectorAll('.ptabs div').forEach(d=>d.classList.toggle('on',d.dataset.p===S.ptab));
  if(S.ptab==='ideas'){
    b.innerHTML=`<p style="color:#5B7290">Tap an idea to jump the phone to it. <b>FE</b> = frontend only · <b>BE</b> = needs backend · <b>BOTH</b>.</p>`+
      IDEAS.map((i,n)=>`<div class="idea" onclick="IDEAS[${n}].go();render()"><b>${i.t}<span class="k ${i.k==='BE'?'be':i.k==='BOTH'?'both':''}">${i.k}</span></b><span>${i.d}</span></div>`).join('');
  } else if(S.ptab==='journey'){
    b.innerHTML=`<h4>The guided journey (new user)</h4><p>The app already has a tour, but a tour is read once and forgotten. The mockup replaces "explain" with "do": every step is a real action with a deep link, and the card sticks around until the steps are done.</p>
    <div class="map">
    ${[['Welcome popup','One screen, one idea: "adding to cart is the like". Button drops you on the feed.',()=>{S.user='new';S.popup=true;tab('feed');}],
       ['Feed with journey card','5 steps · progress bar · points. Sits under the announcement.',()=>{S.user='new';S.popup=false;tab('feed');}],
       ['First cart',"Tap the cart on any post → toast → the step checks itself off.",()=>{S.user='new';S.popup=false;tab('feed');cart('hat');}],
       ['Say hi in Open chat','Community tab shows a "👋 Say hi — I\'m new" quick reply. One tap, someone waves back.',()=>{S.user='new';tab('chat');}],
       ['Follow a tag','Search → trending tags → "Follow tag" makes the feed personal.',()=>go('results','#WomanOwned')],
       ['First purchase → review nudge','After delivery, a one-tap star sheet appears in the feed, You tab and bell.',()=>{S.user='regular';tab('feed');sheet('review');}],
       ['Regular rhythm','You tab: points ring, "Your week", things waiting for review, "Got something to sell?"',()=>{S.user='regular';tab('you');}]
      ].map((s,i)=>`<div class="mstep" onclick="JSTEPS[${i}]();render()"><div class="n">${i+1}</div><div><b>${s[0]}</b><span>${s[1]}</span></div></div>`).join('')}</div>
    <h4>Connecting the tabs</h4><p>Market → Community: "chat is buzzing" and "new in your forum" cards. Community → Market: product cards inside chat and DMs that add to cart. Everything → You: points, reviews waiting, notifications that deep-link back to the post.</p>`;
    window.JSTEPS=[()=>{S.user='new';S.popup=true;tab('feed');},()=>{S.user='new';S.popup=false;tab('feed');},()=>{S.user='new';S.popup=false;tab('feed');cart('hat');},()=>{S.user='new';tab('chat');},()=>go('results','#WomanOwned'),()=>{S.user='regular';tab('feed');sheet('review');},()=>{S.user='regular';tab('you');}];
  } else if(S.ptab==='feed'){
    b.innerHTML=`<h4>What makes the feed feel alive</h4><p>Right now the feed is one card type on repeat. The fix is a <b>recipe</b>, not more posts: the backend assembles the feed from several sources and the client renders each as its own card.</p>
    <h4>Sources (ranked)</h4><ul>
    <li><b>Admin announcement</b> — newest unretired one, always slot 1 (hero for new users, compact card for regulars).</li>
    <li><b>Human posts</b> — listings, reviews, shoutouts, cart posts (what you have today).</li>
    <li><b>Moments</b> — system cards generated from events: "N things carted today", "X restocked", "Y joined near you", "thread heating up". Cheap to compute with the counters/triggers you already have.</li>
    <li><b>Nudges for <i>this</i> user</b> — delivered-not-reviewed, carted-not-bought after 3 days, forum they joined has new replies, seller they bought from posted.</li>
    <li><b>Rails</b> — makers near you, tag you follow, "also in carts with this".</li></ul>
    <h4>Rules</h4><ul><li>Never two of the same card type in a row.</li><li>At most 1 in 4 cards is system-generated (moments + rails).</li><li>At most 1 nudge per screen-height; a dismissed nudge stays gone for 7 days.</li><li>Announcements: one hero max, then compact.</li><li>New users get the journey card pinned at position 2 until done.</li></ul>
    <h4>Warm vs full social</h4><p><b>Warm</b> = everything above. <b>Full</b> adds: stories-style drop rail, streak pill, "people you bought from carted this", countdown drop cards, unread counts on tabs, and an "all caught up → go to Community" hand-off. Ship warm first, A/B the full pieces one at a time with the popups you already schedule.</p>`;
  } else {
    b.innerHTML=`<div class="verdict"><b>Short answer: no — not as posts.</b><br>Auto-posting every product turns the feed into a catalog scroll, which is exactly the "flat" feeling. It also drowns the human posts that make it social, and sellers stop posting because "the app already did it".</div>
    <h4>What to do instead</h4><ul>
    <li><b>Auto-create moments, not posts.</b> Product events become system cards: <i>New in the shop: Daybreak Digitals (4 items)</i> — one card per seller per day, max 4 tiles, tap-through to the shop. Restocks and price drops become <i>Drop</i> cards. Products still get into the feed, just batched and labelled.</li>
    <li><b>First-listing auto-post, once.</b> When a seller's first product is approved, publish one real listing post on their behalf (they can edit or delete it). Gets every shop on the feed exactly once.</li>
    <li><b>Prompt the seller to post.</b> When a listing is approved, push: "Your hat is live — post it to the feed? 1 tap." Seller-authored posts get a caption and a face, which is what people engage with.</li>
    <li><b>Products live in rails, not cards.</b> "Makers near you", "Also in carts with this", "New under #tag" surface the catalog without pretending to be posts.</li>
    <li><b>Cap it.</b> No more than 1 in 4 feed cards is system-generated. If the human feed is thin (early days), fill with moments and rails, not raw products.</li></ul>
    <h4>Why this is still "dynamic"</h4><p>The feed changes every visit because moments and nudges are per-user and time-based, not because the catalog is dumped in. That's the difference between Instagram and a Shopify collection page.</p>`;
  }
}
document.querySelectorAll('#modeSeg button').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;syncSeg();render();});
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;syncSeg();render();});
document.querySelectorAll('#userSeg button').forEach(b=>b.onclick=()=>{S.user=b.dataset.u;S.popup=true;S.carted={};S.joined=false;syncSeg();tab('feed');});
document.querySelectorAll('.ptabs div').forEach(d=>d.onclick=()=>{S.ptab=d.dataset.p;renderPanel();});
function syncSeg(){document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===S.mode));document.querySelectorAll('#themeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.theme));document.querySelectorAll('#userSeg button').forEach(b=>b.classList.toggle('on',b.dataset.u===S.user));}
const _render=render;render=function(){syncSeg();_render();};
render();
</script>
</body>
</html>
